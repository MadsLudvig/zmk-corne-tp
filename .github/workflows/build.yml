name: Build ZMK Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
            kb_zmk_ps2_mouse_trackpoint_driver/
            zmk-nice-oled/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: West init
        run: west init -l config

      - name: West update
        run: west update

      - name: West zephyr-export
        run: west zephyr-export

      - name: Build (corne_tp_right)
        run: |
          west build -s zmk/app -b nice_nano_v2 -- \
            -DSHIELD=corne_tp_right \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Rename right firmware
        run: |
          mkdir -p firmware
          cp build/zephyr/zmk.uf2 firmware/corne_tp_right-nice_nano_v2.uf2

      - name: Clean build
        run: rm -rf build

      - name: Build (corne_tp_left)
        run: |
          west build -s zmk/app -b nice_nano_v2 -- \
            -DSHIELD="corne_tp_left nice_view_adapter nice_view" \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Rename left firmware
        run: cp build/zephyr/zmk.uf2 firmware/corne_tp_left-nice_nano_v2.uf2

      - name: Clean build for settings reset
        run: rm -rf build

      - name: Build (settings_reset)
        run: |
          west build -s zmk/app -b nice_nano_v2 -- \
            -DSHIELD=settings_reset \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Rename settings reset firmware
        run: cp build/zephyr/zmk.uf2 firmware/settings_reset-nice_nano_v2.uf2

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/
