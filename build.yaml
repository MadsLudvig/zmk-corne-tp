# Build configuration for Corne with Trackpoint
# Right side is CENTRAL (has trackpoint), Left side is PERIPHERAL (has display)

include:
  # Right side - Central with Trackpoint (no display)
  - board: nice_nano_v2
    shield: corne_tp_right

  # Left side - Peripheral with nice!view display
  - board: nice_nano_v2
    shield: corne_tp_left nice_view_adapter nice_view

  # Settings reset - flash to both halves to clear bluetooth bonds
  - board: nice_nano_v2
    shield: settings_reset
