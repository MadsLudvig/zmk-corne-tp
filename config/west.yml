manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: badjeff
      url-base: https://github.com/badjeff

  projects:
    # Mainline ZMK (Zephyr 4.1). Tracks main; once a release tag (v0.4+)
    # ships Zephyr 4.1, consider pinning to it here and in the workflow ref.
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml

    # PS/2 TrackPoint driver (mainline-compatible, reports via Zephyr input
    # events). Only compiled on the right half, where the PS/2 device exists.
    - name: kb_zmk_ps2_mouse_trackpoint_driver
      remote: badjeff
      revision: main

  self:
    path: config
