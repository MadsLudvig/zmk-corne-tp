manifest:
  remotes:
    - name: urob
      url-base: https://github.com/urob
    - name: infused-kim
      url-base: https://github.com/infused-kim
    - name: mctechnology17
      url-base: https://github.com/mctechnology17

  projects:
    # Using urob's fork (more up-to-date, has mouse support)
    - name: zmk
      remote: urob
      revision: main
      import: app/west.yml

    # PS/2 Trackpoint driver module
    - name: kb_zmk_ps2_mouse_trackpoint_driver
      remote: infused-kim
      revision: main

    # Nice!view display with dual battery support
    - name: zmk-nice-oled
      remote: mctechnology17
      revision: main

  self:
    path: config
