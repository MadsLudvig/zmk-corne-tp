manifest:
  remotes:
    - name: infused-kim
      url-base: https://github.com/infused-kim
    - name: mctechnology17
      url-base: https://github.com/mctechnology17

  projects:
    # Using infused-kim's ZMK fork (known working with trackpoint driver)
    - name: zmk
      remote: infused-kim
      revision: pr-testing/mouse_ps2_module_base
      import: app/west.yml

    # PS/2 Trackpoint driver module
    - name: kb_zmk_ps2_mouse_trackpoint_driver
      remote: infused-kim
      revision: main

    # Nice!view display with dual battery support
    - name: zmk-nice-oled
      remote: mctechnology17
      revision: main

  self:
    path: config
