# Corne TP Right Side Configuration (PERIPHERAL with PS/2 TrackPoint)
#
# The PS/2 driver itself is enabled automatically from the devicetree
# (uart-ps2 / zmk,input-mouse-ps2 nodes exist only in corne_tp_right.overlay).

# Error mitigation for the PS/2 driver (helps with transmission errors).
# Lives here because the symbol only exists when the PS/2 driver is built.
CONFIG_ZMK_INPUT_MOUSE_PS2_ENABLE_ERROR_MITIGATION=y
