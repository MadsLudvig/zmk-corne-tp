# Corne TP Left Side Configuration (CENTRAL with nice!view display)

# Enable display (also enabled by the stock nice_view shield; kept explicit).
# The stock nice!view central status screen is used.
CONFIG_ZMK_DISPLAY=y

# Fetch the right half's battery level over the split link and proxy it to
# the host as a second battery. These options only exist on the central.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
