# Corne with Trackpoint Configuration

# ============================================
# Core Settings
# ============================================

# Keyboard name (shown in Bluetooth pairing)
CONFIG_ZMK_KEYBOARD_NAME="Corne TP"

# Enable deep sleep (save battery when idle)
CONFIG_ZMK_SLEEP=y

# ============================================
# Split Keyboard Settings
# ============================================

# Enable split keyboard support
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# Fetch peripheral battery level (for dual battery display)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ============================================
# Battery Reporting
# ============================================

CONFIG_ZMK_BATTERY_REPORTING=y

# ============================================
# Trackpoint / Mouse Settings
# ============================================

# Enable mouse support
CONFIG_ZMK_MOUSE=y

# Error mitigation for GPIO PS/2 driver (helps with transmission errors)
CONFIG_ZMK_INPUT_MOUSE_PS2_ENABLE_ERROR_MITIGATION=y

# ============================================
# Display Settings (nice!view on left side)
# ============================================

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# ============================================
# Debugging - USB Logging (disable for production)
# ============================================

# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_ZMK_LOGGING_MINIMAL=y
# CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000

# ============================================
# Bluetooth Settings
# ============================================

# Increase BT signal strength (helps with split connection)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ============================================
# Power Management
# ============================================

# Idle timeout before deep sleep (ms) - 30 minutes
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Idle timeout before entering idle state (ms) - 30 seconds
CONFIG_ZMK_IDLE_TIMEOUT=30000
