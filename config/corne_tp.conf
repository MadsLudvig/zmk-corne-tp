# Corne with Trackpoint Configuration

# ============================================
# Core Settings
# ============================================

# Keyboard name (shown in Bluetooth pairing)
CONFIG_ZMK_KEYBOARD_NAME="Corne TP"

# Enable deep sleep (save battery when idle)
CONFIG_ZMK_SLEEP=y

# ============================================
# Split Keyboard Settings
# ============================================

# Enable split keyboard support
# Left = central (host + nice!view), right = peripheral (TrackPoint).
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# Peripheral battery fetching/proxy is central-only: see corne_tp_left.conf

# ============================================
# Battery Reporting
# ============================================

CONFIG_ZMK_BATTERY_REPORTING=y

# ============================================
# Trackpoint / Mouse Settings
# ============================================

# Enable pointing support on both halves: needed for &mkp and the input
# listener on the central, and for the split input forwarder on the peripheral.
CONFIG_ZMK_POINTING=y

# PS/2 driver options are right-only: see corne_tp_right.conf

# ============================================
# Bluetooth Settings
# ============================================

# Increase BT signal strength (helps with split connection)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ============================================
# Power Management
# ============================================

# Idle timeout before deep sleep (ms) - 30 minutes
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Idle timeout before entering idle state (ms) - 30 seconds
CONFIG_ZMK_IDLE_TIMEOUT=30000
